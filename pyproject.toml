[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.11,<0.12" ]

[project]
name = "lazy-log-formatter"
version = "0.12.1"
description = "A pre-commit script to make log lines lazier"
readme = "README.md"
keywords = [
  "code-quality",
  "f-strings",
  "lazy logging",
  "linting",
  "logging",
  "pre-commit",
  "pylint",
  "W1203",
]
license = "MIT"
license-files = [ "LICENSE" ]
authors = [ { name = "Daniel Marín" } ]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Utilities",
]
dependencies = [ "libcst>=1.8.6" ]
urls.homepage = "https://github.com/dmar1n/lazy-log-formatter"
urls.repository = "https://github.com/dmar1n/lazy-log-formatter"
scripts.lazy-log-formatter = "lazy_log.cli:main"

[dependency-groups]
dev = [ "hypothesis>=6.156.1", "pre-commit>=4.6", "pytest>=9.1.1" ]

[tool.uv]
build-backend.module-name = "lazy_log"
build-backend.module-root = "src"
